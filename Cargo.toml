[workspace]
resolver = "2"
members = [
    "crates/audio-engine",
    "crates/music-core",
    "crates/project",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.2.7"
edition = "2021"
license = "UNLICENSED"
authors = ["EthnoFlow Studio"]

[workspace.dependencies]
cpal = "0.16"
hound = "3.5"
ringbuf = "0.4"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
