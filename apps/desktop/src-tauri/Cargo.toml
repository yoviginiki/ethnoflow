[package]
name = "ethnoflow-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "EthnoFlow Studio desktop shell (Tauri 2)"

[lib]
name = "ethnoflow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
ethnoflow-audio-engine = { path = "../../../crates/audio-engine" }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
