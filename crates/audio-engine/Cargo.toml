[package]
name = "ethnoflow-audio-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Real-time audio I/O, recording, playback, WAV and waveform peaks for EthnoFlow Studio"

[lib]
name = "audio_engine"
path = "src/lib.rs"

[dependencies]
cpal = { workspace = true }
hound = { workspace = true }
ringbuf = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
log = { workspace = true }
symphonia = { version = "0.6", default-features = false, features = ["mp3", "flac", "ogg", "vorbis", "wav", "pcm"] }
midir = "0.11"

[dev-dependencies]
tempfile = "3"
