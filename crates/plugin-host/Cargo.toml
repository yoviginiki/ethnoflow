[package]
name = "ethnoflow-plugin-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLAP instrument host for EthnoFlow Studio (ADR-0018 spike): loads .clap libraries, instantiates instruments, feeds note events and renders them as graph sources. Pure Rust (clap-sys + libloading); no C++ toolchain needed to host."

[lib]
name = "plugin_host"
path = "src/lib.rs"

[dependencies]
clap-sys = { workspace = true }
libloading = { workspace = true }
ethnoflow-audio-engine = { path = "../audio-engine" }
log = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
ethnoflow-clap-fixture = { path = "../clap-fixture" }
